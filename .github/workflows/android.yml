# VORA CITY — builds the web game and wraps it into a debug APK with Capacitor.
# Every push produces an installable artifact; tags `v*` also attach the APK to a GitHub Release.
name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      - name: Typecheck + tests
        run: |
          npm run typecheck
          npm test

      - name: Generate characters (gitignored assets)
        run: npm run characters

      - name: Build web
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/vora-city-${GITHUB_SHA::7}-debug.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: vora-city-debug-apk
          path: out/*.apk
          retention-days: 30

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
